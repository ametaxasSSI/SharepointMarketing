<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Access</title>

<base target="_blank">

<style>
  /* ---------- Easy-to-change settings ---------- */
  :root {
    --accent: #E31E24;          /* icon color */
    --text: #242424;            /* headings and link text */
    --text-muted: #5c5c5c;      /* chevrons */
    --card-bg: #ffffff;
    --card-border: #e1e1e1;
    --row-hover: #f5f5f5;
    --page-bg: transparent;     /* transparent so it blends with SharePoint */
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    /* Segoe UI matches SharePoint's own font so the embed blends in */
    font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
  }

  .quick-access {
    padding: 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px 12px 10px;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 6px 10px;
  }

  .card-header svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    color: var(--accent);
  }

  .card-header h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 6px 7px 44px;   /* indent lines links up under the heading text */
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    border-radius: 4px;
  }

  .links a:hover {
    background: var(--row-hover);
  }

  .links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .links a::after {
    content: "";
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--text-muted);
    border-top: 1.5px solid var(--text-muted);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Stack to one column on narrow screens (skips 2-across to avoid a lone third card) */
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<section class="quick-access" aria-label="Quick Access">
  <div class="grid">

    <!-- ===== Brand Assets ===== -->

        </svg>
        <h3>Brand Assets</h3>
      </div>
      <ul class="links">
        <li><a href="https://sportsspecialties.sharepoint.com/Shared%20Documents/Forms/AllItems.aspx?id=%2FShared%20Documents%2FCorporate%20Docs%2FCompany%20Logos%2FSportsfield&viewid=76db019d%2D6cd2%2D404a%2Dbae0%2D565bde3360f2&p=true&ga=1">Logos</a></li>

          <path d="M6 2.75h8l4.25 4.25v13.25a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.75a1 1 0 0 1 1-1Z"/>
          <path d="M14 2.75V7h4.25"/>

      <ul class="links">

</section>

</body>
